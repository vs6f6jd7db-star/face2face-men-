<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face 2 Face Coffee & Tea | Menü</title><style>
:root{--g:#0d5b45;--m:#dff3ea;--c:#fbfaf4;--line:#dce9e3;--muted:#6b7f78}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--c);color:#173d32}.hero{background:linear-gradient(135deg,#0d5b45,#18795d);color:#fff;padding:42px 20px}.wrap{max-width:1050px;margin:auto}.hero h1{margin:0 0 8px;font-size:32px}.hero p{opacity:.85}.tools{position:sticky;top:0;background:#fbfaf4ee;backdrop-filter:blur(10px);padding:12px 0;z-index:3;border-bottom:1px solid var(--line)}input,button,select{font:inherit}.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:22px 0}.section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.section h2{margin:0 0 12px;color:var(--g)}.item{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}.item b{color:var(--g);white-space:nowrap}.sub{font-size:11px;letter-spacing:1px;color:var(--g);font-weight:800;margin-top:12px}.status{font-size:12px;color:var(--muted)}footer{text-align:center;padding:30px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:30px 18px}.wrap{padding-left:14px;padding-right:14px}}
</style></head><body><header class="hero"><div class="wrap"><h1>FACE 2 FACE</h1><p>Coffee & Tea • Edirne</p><div class="status" id="status">Menü yükleniyor…</div></div></header><div class="tools"><div class="wrap"><input id="q" class="search" placeholder="Menüde ara…"><div id="chips" class="chips"></div></div></div><main class="wrap"><div id="grid" class="grid"></div></main><footer>Face 2 Face Coffee & Tea</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let data=[],active='Tümü'; const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function load(){try{if(!window.F2F_CONFIG?.url||window.F2F_CONFIG.url.includes('BURAYA')) throw 0; const sb=supabase.createClient(F2F_CONFIG.url,F2F_CONFIG.anonKey);let {data:d,error}=await sb.from('published_menu').select('payload').eq('id',1).single();if(error)throw error;data=d.payload;status.textContent='Güncel menü';}catch(e){data=await fetch('menu.json').then(r=>r.json());status.textContent='Başlangıç menüsü';}renderChips();render()}
function renderChips(){chips.innerHTML=['Tümü',...data.map(x=>x.name)].map(x=>`<button class="chip" onclick="active=${JSON.stringify('X')}.replace('X',this.textContent);render()">${esc(x)}</button>`).join('')}
function render(){let term=q.value.toLocaleLowerCase('tr');grid.innerHTML=data.filter(c=>active==='Tümü'||c.name===active).map(c=>{let last='';let its=c.items.filter(i=>i.visible!==false&&i.name.toLocaleLowerCase('tr').includes(term));if(!its.length)return'';return `<section class="section"><h2>${esc(c.name)}</h2>${its.map(i=>{let sub=i.subgroup&&i.subgroup!==last?`<div class="sub">${esc(i.subgroup)}</div>`:'';last=i.subgroup;return sub+`<div class="item"><span>${esc(i.name)}</span><b>${esc(i.price)}</b></div>`}).join('')}</section>`}).join('')};q.oninput=render;load();
</script></body></html>
