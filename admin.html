<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face2Face Yönetim</title><style>body{font-family:system-ui;background:#f7f6ef;color:#173d32;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}h1{color:#0d5b45}.box,.cat{background:#fff;border:1px solid #dce9e3;border-radius:16px;padding:16px;margin:12px 0}input{padding:10px;border:1px solid #ccdcd5;border-radius:10px;width:100%}button{padding:10px 13px;border:0;border-radius:10px;background:#0d5b45;color:white;font-weight:700;cursor:pointer}.secondary{background:#e4eee9;color:#0d5b45}.danger{background:#9c3434}.row{display:grid;grid-template-columns:1fr 150px auto auto;gap:8px;margin:8px 0;align-items:center}.top{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.muted{color:#6b7f78;font-size:13px}@media(max-width:650px){.row{grid-template-columns:1fr 100px}.row button{width:100%}}</style></head><body><div class="wrap"><h1>Face2Face Yönetim</h1><div id="login" class="box"><p>Yönetici hesabınla giriş yap.</p><input id="email" placeholder="E-posta"><br><br><input id="pass" type="password" placeholder="Şifre"><br><br><button onclick="signIn()">Giriş yap</button><p id="msg" class="muted"></p></div><div id="panel" class="hidden"><div class="top"><button onclick="saveDraft()">Taslağı Kaydet</button><button onclick="publish()">Yayınla</button><button class="secondary" onclick="addCat()">Kategori Ekle</button><button class="secondary" onclick="signOut()">Çıkış</button></div><p class="muted">Taslağı Kaydet müşterilerin gördüğü menüyü değiştirmez. Yalnızca “Yayınla” canlı menüyü günceller.</p><div id="cats"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(F2F_CONFIG.url,F2F_CONFIG.anonKey);let menu=[];const E=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function signIn(){let r=await sb.auth.signInWithPassword({email:email.value,password:pass.value});msg.textContent=r.error?r.error.message:'';if(!r.error)start()}async function signOut(){await sb.auth.signOut();location.reload()}async function start(){login.classList.add('hidden');panel.classList.remove('hidden');let r=await sb.from('menu_drafts').select('payload').eq('id',1).single();if(r.data)menu=r.data.payload;else menu=await fetch('menu.json').then(r=>r.json());render()}
function render(){cats.innerHTML=menu.map((c,ci)=>`<div class="cat"><div class="row"><input value="${E(c.name)}" onchange="menu[${ci}].name=this.value"><span></span><button class="secondary" onclick="addItem(${ci})">Ürün +</button><button class="danger" onclick="menu.splice(${ci},1);render()">Sil</button></div>${c.items.map((i,ii)=>`<div class="row"><input value="${E(i.name)}" onchange="menu[${ci}].items[${ii}].name=this.value"><input value="${E(i.price)}" onchange="menu[${ci}].items[${ii}].price=this.value"><button class="secondary" onclick="menu[${ci}].items[${ii}].visible=!menu[${ci}].items[${ii}].visible;render()">${i.visible===false?'Göster':'Gizle'}</button><button class="danger" onclick="menu[${ci}].items.splice(${ii},1);render()">Sil</button></div>`).join('')}</div>`).join('')}
function addCat(){menu.push({name:'Yeni Kategori',sort:menu.length,items:[]});render()}function addItem(ci){menu[ci].items.push({name:'Yeni Ürün',price:'0 TL',visible:true,sort:menu[ci].items.length});render()}
async function saveDraft(){let r=await sb.from('menu_drafts').upsert({id:1,payload:menu,updated_at:new Date().toISOString()});alert(r.error?'Hata: '+r.error.message:'Taslak kaydedildi. Müşteriler henüz görmüyor.')}async function publish(){if(!confirm('Taslağı müşterilere yayınlamak istiyor musun?'))return;let r=await sb.from('published_menu').upsert({id:1,payload:menu,published_at:new Date().toISOString()});alert(r.error?'Hata: '+r.error.message:'Menü yayınlandı.')}sb.auth.getSession().then(x=>{if(x.data.session)start()});
</script></body></html>
