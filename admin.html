<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face2Face Yönetim</title>
<style>
:root{--g:#0d5b45;--bg:#f4f8f6;--line:#dcebe4;--red:#9c3434}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17352d}
.wrap{max-width:1000px;margin:auto;padding:20px}h1{color:var(--g)}.box,.cat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
input{padding:11px;border:1px solid #ccdcd5;border-radius:10px;width:100%}button{padding:10px 13px;border:0;border-radius:10px;background:var(--g);color:white;font-weight:700;cursor:pointer}
.secondary{background:#e4eee9;color:var(--g)}.danger{background:var(--red)}.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}
.row{display:grid;grid-template-columns:1fr 150px auto auto;gap:8px;margin:8px 0;align-items:center}.muted{color:#6b7f78;font-size:13px}#msg{white-space:pre-wrap}
@media(max-width:650px){.row{grid-template-columns:1fr 100px}.row button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<h1>Face2Face Yönetim</h1>
<div id="login" class="box">
<p>Yönetici hesabınla giriş yap.</p>
<input id="email" type="email" placeholder="E-posta"><br><br>
<input id="pass" type="password" placeholder="Şifre"><br><br>
<button onclick="signIn()">Giriş yap</button>
<p id="msg" class="muted"></p>
</div>

<div id="panel" class="hidden">
<div class="top">
<button onclick="saveDraft()">Taslağı Kaydet</button>
<button onclick="publishMenu()">Yayınla</button>
<button class="secondary" onclick="addCat()">Kategori Ekle</button>
<button class="secondary" onclick="signOut()">Çıkış</button>
</div>
<p class="muted">“Taslağı Kaydet” müşterilerin gördüğü menüyü değiştirmez. Yalnızca “Yayınla” canlı menüyü günceller.</p>
<div id="status" class="muted"></div>
<div id="cats"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

e": true}, {"name": "Dağ Çilekli", "price": "130 TL", "visible": true}, {"name": "Dibek", "price": "130 TL", "visible": true}, {"name": "Damla Sakızlı", "price": "130 TL", "visible": true}, {"name": "Bardak Çay", "price": "60 TL", "visible": true}, {"name": "Fincan Çay", "price": "80 TL", "visible": true}, {"name": "Su", "price": "40 TL", "visible": true}, {"name": "Cola Zero", "price": "120 TL", "visible": true}, {"name": "Organik Meyve Suları", "price": "130 TL", "visible": true}, {"name": "Sade Soda", "price": "80 TL", "visible": true}, {"name": "Elmalı Soda", "price": "80 TL", "visible": true}, {"name": "Limon Soda", "price": "80 TL", "visible": true}, {"name": "Karpuz Çilek Soda", "price": "80 TL", "visible": true}, {"name": "Redbull", "price": "160 TL", "visible": true}]}, {"name": "Cold Brew", "sort": 10, "items": [{"name": "Cold Brew", "price": "220 TL", "visible": true}]}, {"name": "Ekstralar", "sort": 11, "items": [{"name": "Ekstra Bardak / Buzlu Bardak", "price": "30 TL", "visible": true}, {"name": "Ekstra Shot", "price": "35 TL", "visible": true}, {"name": "Ekstra Şurup", "price": "35 TL", "visible": true}]}];
let menu=[];
let sb;

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function status(t){document.getElementById('status').textContent=t||'';}
function message(t){document.getElementById('msg').textContent=t||'';}

function initClient(){
  if(!window.F2F_CONFIG || !F2F_CONFIG.url || !F2F_CONFIG.anonKey) throw new Error("config.js ayarları bulunamadı.");
  if(!window.supabase || !window.supabase.createClient) throw new Error("Supabase kütüphanesi yüklenemedi.");
  sb=window.supabase.createClient(F2F_CONFIG.url,F2F_CONFIG.anonKey);
}

async function signIn(){
  try{
    message("Giriş yapılıyor...");
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('pass').value;
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(!data.session) throw new Error("Oturum açılamadı.");
    await start();
  }catch(e){message("Hata: "+(e.message||e));}
}

async function signOut(){
  await sb.auth.signOut();
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  message("Çıkış yapıldı.");
}

async function start(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  status("Menü yükleniyor...");
  try{
    let r=await sb.from('menu_drafts').select('payload').eq('id',1).maybeSingle();
    if(r.error) throw r.error;
    if(r.data?.payload) menu=r.data.payload;
    else {
      r=await sb.from('published_menu').select('payload').eq('id',1).maybeSingle();
      if(r.error) throw r.error;
      menu=r.data?.payload || DEFAULT_MENU;
    }
    render(); status("Hazır.");
  }catch(e){status("Yükleme hatası: "+(e.message||e));}
}

function render(){
  const cats=document.getElementById('cats');
  cats.innerHTML=menu.map((c,ci)=>`
    <div class="cat">
      <div class="top">
        <input value="${esc(c.name)}" onchange="menu[${ci}].name=this.value">
        <button class="secondary" onclick="addItem(${ci})">Ürün Ekle</button>
        <button class="danger" onclick="menu.splice(${ci},1);render()">Kategoriyi Sil</button>
      </div>
      ${(c.items||[]).map((i,ii)=>`
        <div class="row">
          <input value="${esc(i.name)}" onchange="menu[${ci}].items[${ii}].name=this.value">
          <input value="${esc(i.price)}" onchange="menu[${ci}].items[${ii}].price=this.value">
          <button class="secondary" onclick="menu[${ci}].items[${ii}].visible=!menu[${ci}].items[${ii}].visible;render()">${i.visible===false?'Göster':'Gizle'}</button>
          <button class="danger" onclick="menu[${ci}].items.splice(${ii},1);render()">Sil</button>
        </div>`).join('')}
    </div>`).join('');
}

function addCat(){menu.push({name:'Yeni Kategori',sort:menu.length,items:[]});render();}
function addItem(ci){menu[ci].items.push({name:'Yeni Ürün',price:'0 TL',visible:true});render();}

async function saveDraft(){
  status("Taslak kaydediliyor...");
  const {error}=await sb.from('menu_drafts').upsert({id:1,payload:menu,updated_at:new Date().toISOString()});
  status(error ? "Hata: "+error.message : "Taslak kaydedildi. Müşteri menüsü değişmedi.");
}

async function publishMenu(){
  status("Yayınlanıyor...");
  const d=await sb.from('menu_drafts').upsert({id:1,payload:menu,updated_at:new Date().toISOString()});
  if(d.error){status("Hata: "+d.error.message);return;}
  const p=await sb.from('published_menu').upsert({id:1,payload:menu,published_at:new Date().toISOString()});
  status(p.error ? "Hata: "+p.error.message : "Menü yayınlandı.");
}

(async()=>{
  try{
    initClient();
    const {data}=await sb.auth.getSession();
    if(data.session) await start();
  }catch(e){message("Bağlantı hatası: "+(e.message||e));}
})();
</script>
</body>
</html>
