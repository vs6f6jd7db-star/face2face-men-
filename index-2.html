<title>Face 2 Face Coffee & Tea | Menü</title>
<style>
:root{--g:#0d5b45;--m:#dff3ea;--c:#fbfaf4;--line:#dce9e3;--muted:#6b7f78}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--c);color:#173d32}
.hero{background:linear-gradient(135deg,#0d5b45,#18795d);color:#fff;padding:32px 20px;text-align:center}.wrap{max-width:1050px;margin:auto}.hero-logo{width:112px;height:112px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 14px;border:3px solid rgba(255,255,255,.9);box-shadow:0 5px 18px rgba(0,0,0,.18)}.hero h1{margin:0 0 8px;font-size:32px}.hero p{opacity:.85}
.tools{position:sticky;top:0;background:#fbfaf4ee;backdrop-filter:blur(10px);padding:12px 0;z-index:3;border-bottom:1px solid var(--line)}
input,button{font:inherit}.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:22px 0}
.section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.section h2{margin:0 0 12px;color:var(--g)}.item{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}.item b{color:var(--g);white-space:nowrap}
.sub{font-size:11px;letter-spacing:1px;color:var(--g);font-weight:800;margin-top:12px}.status{font-size:12px;color:#d7eee6}
footer{margin-top:18px;background:#0d5b45;color:white;padding:30px 18px}.footer-card{max-width:700px;margin:auto;text-align:center}.footer-card h3{margin:0 0 14px;font-size:21px}
.footer-address{line-height:1.5;opacity:.9;margin:0 auto 16px;max-width:560px}.footer-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.footer-actions a{display:inline-block;text-decoration:none;background:white;color:var(--g);font-weight:750;padding:11px 15px;border-radius:999px}
.footer-note{font-size:12px;opacity:.7;margin-top:18px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:30px 18px}.wrap{padding-left:14px;padding-right:14px}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const DEFAULT_BUSINESS={"phone": "0532 309 49 97", "address": "1. Murat, Zübeyde Hanım Cd. No:26, 22030 Edirne Merkez/Edirne", "maps": "https://share.google/olo9O8BxGz8JUQm6D", "instagram": "https://www.instagram.com/face2facecoffeeedirne/"};
let data=[],business={...DEFAULT_BUSINESS},active='Tümü';
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function unpack(payload){
  if(Array.isArray(payload)) return {menu:payload,business:{...DEFAULT_BUSINESS}};
  return {menu:Array.isArray(payload?.menu)?payload.menu:[],business:{...DEFAULT_BUSINESS,...(payload?.business||{})}};
}
async function load(){
  try{
    if(!window.F2F_CONFIG?.url) throw new Error('Ayar bulunamadı');
    const sb=supabase.createClient(F2F_CONFIG.url,F2F_CONFIG.anonKey);
    const {data:d,error}=await sb.from('published_menu').select('payload').eq('id',1).single();
    if(error) throw error;
    const u=unpack(d.payload); data=u.menu; business=u.business;
    status.textContent='Güncel menü';
  }catch(e){
    status.textContent='Menü şu anda yüklenemedi';
    data=[];
  }
  renderChips();render();renderBusiness();
}
function renderBusiness(){
  footerAddress.textContent=business.address||'';
  mapLink.href=business.maps||'#';
  const digits=(business.phone||'').replace(/\D/g,'');
  phoneLink.href=digits?'tel:+90'+(digits.startsWith('0')?digits.slice(1):digits):'#';
  phoneLink.textContent='📞 '+(business.phone||'Ara');
  instagramLink.href=business.instagram||'#';
}
function renderChips(){
  chips.innerHTML=['Tümü',...data.map(x=>x.name)].map(x=>`<button class="chip">${esc(x)}</button>`).join('');
  [...chips.querySelectorAll('.chip')].forEach(b=>b.onclick=()=>{active=b.textContent;render();});
}
function render(){
  const term=q.value.toLocaleLowerCase('tr');
  grid.innerHTML=data.filter(c=>active==='Tümü'||c.name===active).map(c=>{
    let last='';
    const its=(c.items||[]).filter(i=>i.visible!==false&&i.name.toLocaleLowerCase('tr').includes(term));
    if(!its.length)return'';
    return `<section class="section"><h2>${esc(c.name)}</h2>${its.map(i=>{
      const sub=i.subgroup&&i.subgroup!==last?`<div class="sub">${esc(i.subgroup)}</div>`:'';
      last=i.subgroup;
      return sub+`<div class="item"><span>${esc(i.name)}</span><b>${esc(i.price)}</b></div>`;
    }).join('')}</section>`;
  }).join('');
}
q.oninput=render;load();
</script>
